# Local PostgreSQL + Redis. Needed from Phase 2. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nextrade
      POSTGRES_USER: nextrade
      POSTGRES_PASSWORD: nextrade
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
